name: DSE Daily Scraper & AI Predictor

on:
  schedule:
    # Runs at 13:00 UTC every Monday-Friday (which is 16:00 / 4:00 PM EAT)
    - cron: '0 13 * * 1-5'
  
  # Allows you to trigger this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  scrape-and-predict:
    runs-on: ubuntu-latest
    
    # Grant permissions needed to commit back to the repo
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run DSE Scraper
        run: |
          python scraper/scraper.py
          
      - name: Run ML Pipeline & Generate JS Data Bridge
        # We enforce utf-8 encoding so the emojis in our print statements don't crash Windows/Linux mixing
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python generate_data_js.py
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add only the new CSVs and the generated data.js
          git add data/raw/*.csv
          git add assets/js/data.js
          
          # Check if there are any changes to commit (prevents failing if data didn't change)
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "🤖 Auto-update: Scraped DSE market data & ran AI predictor [skip ci]"
            git push
          fi
